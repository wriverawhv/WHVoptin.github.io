# JNL Quantum Wireless Call Alarm SMS Notifications

## Resident Call Alarm SMS Opt-In

As a valued team member, you may opt in to receive resident call alarm notifications from the JNL Quantum Wireless Call System, managed by B&B Integrations, via SMS text message.

These alerts may include:
- Wireless nurse call station notifications
- Resident call button alerts
- Other JNL Quantum system alarm events

### What to expect
- Approximately 5–20 text messages per day
- Message and data rates may apply
- Messages are transmitted through a secure encrypted server

### Privacy and security
Your mobile number will:
- Remain private and confidential
- Be used only for JNL Quantum notification services
- Not be shared, sold, or used by B&B Integrations for any other purpose

### Opt out at any time
To stop receiving notifications, simply reply:
STOP

### Consent
By replying YES, you consent to receive SMS messages related to resident call alarm notifications from the JNL Quantum Wireless Call System.

Reply YES to opt in.

Thank you.
